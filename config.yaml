# PaperFetch Configuration File (YAML version)

search:
  # Base query for APIs (joined with OR for Nature, space for CrossRef)
  query:
    - inflammation
    - single cell
    - cancer
    - tumor
    - tissue dynamics
    - hematopoiesis
    - tumour
    - immune
    - immunity
    - perturbation
  max_papers_for_llm: 300
  days_to_check: 11
  springer_publication_names:
    - Nature
    - Nature Cancer
    - Nature Genetics
    - Nature Biotechnology
    - Nature Methods
    - Nature Communications
    - Nature Medicine
    - Nature medicine
    - Nature Immunology

api:
  mailto: "faurel1@mskcc.org"
  enable_springer: true
  springer_api_key: ${SPRINGER_API_KEY}

model:
  name: "google/gemma-3-27b-it"
  batch_size: 16
  max_new_tokens: 150
  temperature: 0.1
  hf_home: "/home/faurel1/data/.cache/huggingface"

query_sets:
  set0:
    name: Basic Cancer
    multiplier: 1.0
    question: "Does this study focuses on Cancer or Tumor?"
  set1:
    name: scRNAseq
    multiplier: 1.0
    question: "Does this study use scRNAseq method?"
  set2:
    name: Tissue/cancer of interest
    multiplier: 1.0
    question: "Does this study focuses on Gastric Cancer, Colorectal Cancer, or Hematopoiesis?"
  set3:
    name: Concepts Biology
    multiplier: 1.0
    question: "Does this study focuses on Cancer Initiation, Tumor evolution, or Tissue Ecosystems?"
  set4:
    name: Cellular Dynamics
    multiplier: 1.0
    question: "Does this study focuses on Cell Fate Decisions or Cell Plasticity?"
  set5:
    name: Advanced sc/spatial tech
    multiplier: 1.0
    question: "Does this study use Single cell Methylation Assay, Chromatin Accessibility Assay, Spatial Transcriptomic Assay (NOT scRNAseq), or Visium HD?"
  set6:
    name: Advanced sc dynamics
    multiplier: 2.0
    question: "Does this study focuses on epigenetic memory, methylation dynamics, clonal evolution, or clonal tracing?"
  set7:
    name: Regulatory effects
    multiplier: 1.0
    question: "Does this study focuses on Post-transcriptional Regulation, Alternative Splicing, or Gene Regulation Dynamics?"
  set8:
    name: Large-scale datasets
    multiplier: 1.0
    question: "Does this study provide a novel and unique Large Patient Cohort or Atlas-scale single cell data?"
  set9:
    name: Deep learning approaches
    multiplier: 1.0
    question: "Did this study develop a new tool using Deep Generative Models or Autoencoders?"
  set10:
    name: Novel computational methods
    multiplier: 2.0
    question: "Does this study provide a new computational tool, computational library, or computational method of analysis?"

slack:
  bot_token: ${SLACK_BOT_TOKEN}
  channel_id: ${SLACK_CHANNEL_ID}
  min_score: 3.0  # Papers with final_score >= this will be posted
